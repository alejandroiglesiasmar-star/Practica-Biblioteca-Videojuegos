<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Préstamo - GameVault</title>
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/tablas.css}">
    <link rel="stylesheet" th:href="@{/css/formularios.css}">
    <style>
        .mensaje-error { background: #ffebee; border-left: 4px solid #f44336; padding: 10px 15px; margin-bottom: 15px; }
    </style>
</head>
<body>
<div th:replace="~{fragments :: menu}"></div>
<div class="container">
    <div th:replace="~{fragments :: cabecera('Registrar Nuevo Préstamo')}"></div>

    <div th:if="${error}" class="mensaje-error" th:text="${error}"></div>

    <form th:action="@{/prestamos/registrar}" method="post" class="form">

        <div class="form-group">
            <label for="idSocio">Socio:</label>
            <select id="idSocio" name="idSocio" class="form-control" required>
                <option value="">-- Seleccione un socio --</option>
                <option th:each="socio : ${socios}"
                        th:value="${socio.id}"
                        th:text="${socio.nombre + ' ' + socio.apellidos}">
                </option>
            </select>
        </div>

        <div class="form-group">
            <label for="idCopia">Copia:</label>
            <select id="idCopia" name="idCopia" class="form-control" required>
                <option value="">-- Seleccione una copia --</option>
                <option th:each="copia : ${copias}"
                        th:value="${copia.id}"
                        th:text="${copia.titulo + ' (' + copia.plataforma + ') - ' + copia.codigoInventario}">
                </option>
            </select>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-success">Registrar Préstamo</button>
            <a th:href="@{/prestamos}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
