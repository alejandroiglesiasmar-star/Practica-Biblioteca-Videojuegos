<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de socios - GameVault</title>
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/tablas.css}">
    <link rel="stylesheet" th:href="@{/css/formularios.css}">
</head>
<body>
<div th:replace="~{fragments :: menu}"></div>
<div class="container">

    <div th:replace="~{fragments :: cabecera('Listado de socios')}"></div>

    <!-- Formulario de Búsqueda / Filtros (RF-03) -->
    <form th:action="@{/socios}" method="get" class="form-busqueda">
        <label for="nombre">Nombre o apellidos</label>
        <input type="text" id="nombre" name="nombre" th:value="${param.nombre}">

        <label for="email">Email</label>
        <input type="text" id="email" name="email" th:value="${param.email}">

        <label for="activo">Activo</label>
        <select id="activo" name="activo">
            <option value="">Todos</option>
            <option value="1" th:selected="${param.activo == '1'}">Sí</option>
            <option value="0" th:selected="${param.activo == '0'}">No</option>
        </select>

        <button type="submit" class="btn btn-primary">Buscar</button>
    </form>

    <div class="acciones" style="margin-top: 20px;">
        <a th:href="@{/socios/nuevo}" class="btn btn-success">Nuevo Socio</a>
    </div>

    <!-- Tabla de Resultados  -->
    <table class="table" style="margin-top: 20px;">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Apellidos</th>
            <th>Email</th>
            <th>Edad</th>
            <th>Activo</th>
            <th>Préstamos abiertos</th>
            <th>Alta</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="socio : ${socios}">
            <td th:text="${socio.id}">1</td>
            <td th:text="${socio.nombre}">Nombre</td>
            <td th:text="${socio.apellidos}">Apellidos</td>
            <td th:text="${socio.email}">correo@mail.test</td>
            <td th:text="${socio.edad}">30</td>
            <td th:text="${socio.activo ? 'Sí' : 'No'}">Sí</td>
            <td th:text="${socio.prestamosAbiertos}">0</td>
            <td th:text="${socio.fechaAlta}">2026-01-01</td>
        </tr>
        <tr th:if="${#lists.isEmpty(socios)}">
            <td colspan="8" class="vacio">No se encontraron socios con los filtros seleccionados.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
