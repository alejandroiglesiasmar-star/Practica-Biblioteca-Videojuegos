<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Socio</title>

    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/tablas.css}">
    <link rel="stylesheet" th:href="@{/css/formularios.css}">
</head>
<body>
<h1>Registrar Nuevo Socio</h1>

<p><a th:href="@{/socios}">Volver al listado</a></p>

<div th:if="${error}" style="color: red; margin-bottom: 15px;" th:text="${error}"></div>

<form th:action="@{/socios/guardar}" th:object="${socio}" method="post">
    <div>
        <label for="nombre">Nombre:</label><br>
        <input type="text" id="nombre" th:field="*{nombre}" required>
    </div>
    <br>
    <div>
        <label for="apellidos">Apellidos:</label><br>
        <input type="text" id="apellidos" th:field="*{apellidos}" required>
    </div>
    <br>
    <div>
        <label for="dni">DNI:</label><br>
        <input type="text" id="dni" th:field="*{dni}" required>
    </div>
    <br>
    <div>
        <label for="email">Email:</label><br>
        <input type="email" id="email" th:field="*{email}">
    </div>
    <br>
    <div>
        <label for="telefono">Teléfono:</label><br>
        <input type="text" id="telefono" th:field="*{telefono}">
    </div>
    <br>
    <button type="submit">Guardar Socio</button>
</form>
</body>
</html>
